<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Parkour Dash</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="game-shell">
      <header class="hud">
        <div>
          <h1>Parkour Dash</h1>
        </div>
        <div class="stats">
          <span id="status">Ready</span>
          <span id="coins">Coins: 0</span>
        </div>
      </header>

      <canvas id="game" width="960" height="540" aria-label="Parkour game"></canvas>

      <div class="controls">
        <p>Move: A/D or ←/→</p>
        <p>Jump: W, ↑, or Space</p>
        <p>Reset: R</p>
      </div>
    </div>

    <script src="game.js"></script>
  </body>
</html>
